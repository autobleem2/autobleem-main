# AutoBleem v2.0.0-alpha1 volunteer test plan: Windows installer
# Format: the tester portal plan (docs/tester-portal-plan.md): sections of about 10 minutes, each step
# {id, do, expect}. 'status' (ok | problem | na) and 'comment' are what the tester fills in; a comment is
# needed on 'problem' (what you saw, and whether it happens again).
id: win
title: "Windows installer"
version: v2.0.0-alpha1
before_you_start:
  - "Get: AutoBleemSetup-<version>.exe from the Windows panel of the download page (autobleem.retromenele.pl)."
  - "You need: Windows 10 or 11, internet, 2 GB free for the data folder (more with RetroArch), a keyboard (it works as a pad) or an Xbox-style (XInput) pad. The installer works per user and needs no administrator rights."
  - "A PS1 game you legally own. No game and no BIOS is shipped; the emulator uses its built-in HLE BIOS unless you put your own into System/Bios/."
  - "Tick in the setup: Cover databases; Sample games OFF for the welcome-card section; RetroArch (and its BIOS files) ON for the RetroArch section."
  - "Say in each comment which Windows version you used."
  - "Esc leaves the launcher. The data folder is the one you chose (Documents\\AutoBleem by default); logs are in its System\\Logs."
sections:
  - id: win-install
    title: "Install with AutoBleemSetup"
    minutes: 10
    needs: "A Windows 10 / 11 PC with internet."
    steps:
      - id: win-install.1
        do: "Run AutoBleemSetup-<version>.exe."
        expect: "The setup starts without asking for administrator rights. It installs the program per user under %LOCALAPPDATA%\\Programs\\AutoBleem."
        status: ""
        comment: ""
      - id: win-install.2
        do: "Choose the data folder (the default is Documents\\AutoBleem) and tick the components: Cover databases, RetroArch, BIOS files; leave Sample games off."
        expect: "The choices are accepted and the setup helper downloads the ticked components with progress shown."
        status: ""
        comment: ""
      - id: win-install.3
        do: "Finish the setup and start AutoBleem from the Start Menu (and the Desktop shortcut if you made one)."
        expect: "The launcher opens full screen. The keyboard works as a pad (arrow keys, Enter = Cross, Esc / Backspace = Circle, Tab = Triangle, Space = Square)."
        status: ""
        comment: ""
      - id: win-install.4
        do: "Press Esc."
        expect: "The launcher closes cleanly and you are back on the desktop. Start it again from the Start Menu."
        status: ""
        comment: ""
      - id: win-install.5
        do: "Open Settings -> Apps (Add / Remove programs)."
        expect: "AutoBleem is listed with the version of this build. (Do not uninstall unless the plan says so.)"
        status: ""
        comment: ""
  - id: win-firstrun
    title: "First run: the welcome card and adding a game"
    minutes: 8
    needs: "A fresh AutoBleem install with an EMPTY Games folder (no sample games) and one legally owned PS1 game."
    steps:
      - id: win-firstrun.1
        do: "Start the launcher on an install whose Games folder is empty."
        expect: "Instead of an empty shelf a welcome card: 'Hi, and welcome to AutoBleem!' - drop games into Games and press Re-scan games - and it names the place for your platform: in your AutoBleem folder (the data folder you chose)."
        status: ""
        comment: ""
      - id: win-firstrun.2
        do: "Put one legally owned PS1 game (a .cue + .bin, or a .chd) into its own folder under Games/ - in your AutoBleem folder (the data folder you chose). On the console switch off with Power off first and pull the stick only while the light is red; put the card / stick back afterwards."
        expect: "The files copy; the game's folder name is the game's name."
        status: ""
        comment: ""
      - id: win-firstrun.3
        do: "Quick menu (Up) -> Re-scan games."
        expect: "A scan runs with a progress bubble at the top right; the game appears on the shelf as it is found and the welcome card goes away. Details show publisher, year, players when the databases know the game."
        status: ""
        comment: ""
      - id: win-firstrun.4
        do: "Watch the game's cover."
        expect: "A cover appears (from the cover databases, or fetched online on a Pi / PC / Windows). Note if a game gets no cover."
        status: ""
        comment: ""
  - id: win-launcher
    title: "The launcher: shelf, set picker, Quick menu, system menu"
    minutes: 10
    needs: "AutoBleem installed with at least one game on the shelf."
    steps:
      - id: win-launcher.1
        do: "Start the launcher and look at the shelf (with at least one game on it)."
        expect: "The covers of the current set, the selected one in the middle with a soft reflection under it, its details beside it as a compact grid (a fact the game does not have is left out) and a Play button. The look is the ab2.0.0 theme."
        status: ""
        comment: ""
      - id: win-launcher.2
        do: "Look at the top-left corner, under the pad battery plate (if no pad shows a battery, just the corner)."
        expect: "A small chip with the channel (ALPHA, or RC / TESTING / NIGHTLY for other builds) and the short version beside it. Write the exact text in the comment."
        status: ""
        comment: ""
      - id: win-launcher.3
        do: "Look at the hint bar at the bottom."
        expect: "Two lines of four slots. Line 1 is what the buttons do for the selected game (play, the icon row, the Quick menu). Line 2 is Select, Start, Triangle and L2 + R2, dimmed when one does nothing."
        status: ""
        comment: ""
      - id: win-launcher.4
        do: "Press Select, then (still in the picker) move Up / Down and press L1 / R1 to see the tabs."
        expect: "The PlayStation tab starts at USB games (the whole library; there are no internal games on this platform), then Favorite games and Game history. Each row shows a count. The footer names the keys (L1 / R1 tabs, L2 / R2 page, Cross picks, Circle Back). L1 / R1 switch the PlayStation / RetroArch / Apps tabs (RetroArch only if it is installed)."
        status: ""
        comment: ""
      - id: win-launcher.5
        do: "In the picker choose USB games with Cross."
        expect: "Back on the shelf with the whole library. A bubble at the top right says Showing: USB games for a few seconds."
        status: ""
        comment: ""
      - id: win-launcher.6
        do: "Press Up on the shelf (the Quick menu)."
        expect: "The Quick menu opens with: Re-scan games, Store and System menu... with one-line descriptions. Note whether Network & Controllers and Restart launcher are listed (they are meant for the console, the Pi and the PC stick). Up / Down wrap around; Circle closes it."
        status: ""
        comment: ""
      - id: win-launcher.7
        do: "Press L2 + R2 (the system menu)."
        expect: "The menu opens, grouped: at the top Re-scan games and Extensions; Library (Game Manager, Memory Cards, Scanner processors); System (Options, Network & Controllers where the platform has it, Hardware Information, Software Update on a Pi/PC/Windows, About); Leave (RetroArch only if installed, Power off). Names in sentence case, each row with a description."
        status: ""
        comment: ""
      - id: win-launcher.8
        do: "Press Circle, then Triangle (the button guide)."
        expect: "One page lists every button of every screen. With a USB keyboard connected a Keyboard column shows the keys too."
        status: ""
        comment: ""
  - id: win-options
    title: "Options and switching the language"
    minutes: 10
    needs: "AutoBleem installed and started."
    steps:
      - id: win-options.1
        do: "L2 + R2 -> Options. Scroll through the whole list."
        expect: "Rows are grouped under headings: Interface, Fonts, Sound, Emulation, Library, Updates, Diagnostics. On/off values read ON / OFF. Rows for RetroArch appear only if RetroArch is installed."
        status: ""
        comment: ""
      - id: win-options.2
        do: "Options -> Interface -> Language: choose Polski (or any language you read), then Circle out to the shelf and open L2 + R2."
        expect: "The menus are translated at once, with no restart. Open the system menu, the Quick menu and Options once and check nothing stays in English or is cut off. Switch back to English afterwards."
        status: ""
        comment: ""
      - id: win-options.3
        do: "Options -> Interface -> Display: pick another resolution (look at the list first). "
        expect: "Where the row exists (it is not shown in a development window) the new mode is applied and the question 'Keep this display mode?' appears with a countdown. Do not confirm: the old mode comes back by itself. Repeat and confirm: the new mode stays."
        status: ""
        comment: ""
      - id: win-options.4
        do: "Options -> Interface -> Notification timeout: set 0, then switch the set with Select (any other group)."
        expect: "The value reads Off at 0 and the 'Showing: ...' bubble no longer appears. Set it back to a few seconds and the bubble returns."
        status: ""
        comment: ""
      - id: win-options.5
        do: "Options -> Interface -> Animations OFF, move through two or three screens, then ON again. Also try Cover shine ON / OFF."
        expect: "With animations off every screen change is instant; on, they slide. Cover shine ON shows a shine crossing the selected cover when the shelf comes to rest."
        status: ""
        comment: ""
      - id: win-options.6
        do: "Options -> Interface -> Emulator screen scaling: look at the choices (1x1, 2x (integer), 4:3, 4:3 (integer), Full screen) and pick 4:3."
        expect: "Every value is accepted and shown. (The picture in a game is checked in the games section.)"
        status: ""
        comment: ""
      - id: win-options.7
        do: "Options -> Emulation -> PS1 emulator, and Options -> Updates."
        expect: "PS1 emulator offers pcsx-abnxt (the default) and pcsx-ab. Updates offers release, testing, nightly and off (not shown on a development host); the default follows the installed version. Leave both as you found them."
        status: ""
        comment: ""
      - id: win-options.8
        do: "L2 + R2 -> Software Update."
        expect: "The launcher checks the site. It says there is nothing newer, or offers an update (Update now / Remind me tomorrow / Skip this version). Do not update now; choose Remind me tomorrow if asked."
        status: ""
        comment: ""
  - id: win-game
    title: "Games: start, the in-game menu, Reset and Exit"
    minutes: 10
    needs: "AutoBleem on the shelf with one legally owned PS1 game (a .cue + .bin or a .chd in its own folder under Games/). No BIOS is shipped; the built-in HLE BIOS is used unless you put your own into System/Bios/."
    steps:
      - id: win-game.1
        do: "Select a PS1 game and press Cross."
        expect: "The game starts full screen in pcsx-abnxt (the default emulator) with sound and picture, with no black screen."
        status: ""
        comment: ""
      - id: win-game.2
        do: "In the game: Press Esc on the keyboard (or Select + Start / the Home button on a pad)."
        expect: "The game stops behind the emulator's menu, drawn in the launcher's look, over the game's last picture. It has three tabs Game / Picture / Controllers (L1 / R1 switch them). Close it with the same button and the game goes on."
        status: ""
        comment: ""
      - id: win-game.3
        do: "Open the menu, go to Game -> Saves -> Quick save, play a little, then Quick load."
        expect: "The game returns to the saved moment. Game -> Saves -> Load autosave also works (the game as it was up to 30 seconds ago)."
        status: ""
        comment: ""
      - id: win-game.4
        do: "Open the menu, Picture tab: change Scanlines or Filter, and look at the Scaling row."
        expect: "The picture changes at once. Each row has a help line on the right; a row that does not apply is greyed with the reason in its help line. The Scaling choice from Options -> Emulator screen scaling is respected."
        status: ""
        comment: ""
      - id: win-game.5
        do: "Menu -> Game tab -> CD disc -> Reset game."
        expect: "The menu closes, the emulator shows 'Please wait...' for a moment, and the game starts again from its beginning."
        status: ""
        comment: ""
      - id: win-game.6
        do: "Menu -> Game tab -> Exit."
        expect: "The menu closes, 'Please wait...' is shown while the resume point is written, then the launcher comes back with your game selected."
        status: ""
        comment: ""
      - id: win-game.7
        do: "Start the game again; hold the menu button for 2 seconds."
        expect: "The game is left exactly as with Reset: 'Please wait...', then the launcher."
        status: ""
        comment: ""
      - id: win-game.8
        do: "Menu -> Controllers tab, then Game tab -> PCSX menu, then back."
        expect: "Controller 1 and 2 offer standard (digital), analog (DualShock), a gun or none; the PCSX menu opens PCSX-ReARMed's own pages (options, cheats, About) and returns to the menu."
        status: ""
        comment: ""
  - id: win-resume
    title: "Resume points and memory cards"
    minutes: 10
    needs: "AutoBleem with a PS1 game you can save in."
    steps:
      - id: win-resume.1
        do: "On the shelf pick a game that has never been played and press Down."
        expect: "The icon row opens under the game: Settings, Game, Memory Card, Resume. The Resume icon is greyed out because there is no resume point."
        status: ""
        comment: ""
      - id: win-resume.2
        do: "Start the game, save in the game to its memory card, then use the in-game menu -> Exit."
        expect: "'Please wait...' appears while the resume point is written, then the launcher. The game's Resume icon now shows a small picture."
        status: ""
        comment: ""
      - id: win-resume.3
        do: "Down -> Resume."
        expect: "Four framed cards, each with a picture of the moment, its slot number and date. The newest has a NEWEST chip; an unused slot says 'No resume point'."
        status: ""
        comment: ""
      - id: win-resume.4
        do: "Cross on the NEWEST card."
        expect: "The game continues exactly where you left it, with the saved game on its memory card intact."
        status: ""
        comment: ""
      - id: win-resume.5
        do: "Leave again, then Down -> Resume -> Triangle on a card."
        expect: "The card is deleted; its slot says 'No resume point'. Circle back."
        status: ""
        comment: ""
      - id: win-resume.6
        do: "Down -> Memory Card (the game's memory card editor)."
        expect: "The game's card and a second card side by side, with every save's icon and title. Square copies a save, Triangle deletes one, Select defragments, Start swaps the right-hand card for another set. Try the copy on a throw-away save only."
        status: ""
        comment: ""
      - id: win-resume.7
        do: "L2 + R2 -> Memory Cards -> Square: create a set named Test with the on-screen keyboard; then rename it (Cross) and delete it (Triangle)."
        expect: "The on-screen keyboard (letters, symbols, accents; Shift, Space, Backspace, Confirm) types the name; the set appears, is renamed and is deleted after the confirmation."
        status: ""
        comment: ""
  - id: win-manage
    title: "The game editor, Game Manager and Hardware Information"
    minutes: 8
    needs: "AutoBleem with a game on the shelf."
    steps:
      - id: win-manage.1
        do: "On the shelf pick a game, press Down, then Cross on Game (the game editor)."
        expect: "The details on the right (title, publisher, year, players, folder, memory card) and the settings on the left in four groups: Game, Display, Rendering, Emulator. Display has Resolution, Remove seams, Dithering, Smoothing, Filter, Scanlines, Scanline brightness."
        status: ""
        comment: ""
      - id: win-manage.2
        do: "Change one Display value (for example Scanlines), press Circle, and start the game."
        expect: "The setting is kept and used in the game. Triangle renames the game, Square changes its memory card; Circle saves and leaves."
        status: ""
        comment: ""
      - id: win-manage.3
        do: "Open the game's in-game menu -> Game -> Save settings for this game, leave, and open the game editor again."
        expect: "Display, Rendering and Emulator rows are greyed under the heading 'Saved in the emulator'. 'Unlock the settings' (confirm) makes them editable again."
        status: ""
        comment: ""
      - id: win-manage.4
        do: "L2 + R2 -> Game Manager."
        expect: "The games as a list of titles only; the selected game's folder is in its details, its cover beside it; free space at top right. Do NOT delete a game you want to keep (Square deletes)."
        status: ""
        comment: ""
      - id: win-manage.5
        do: "L2 + R2 -> Hardware Information."
        expect: "One page: system, CPU, storage with free space, network addresses, display and audio, the connected pads (the first two as Player 1 and Player 2). The page refreshes every second. It does not open PSC-Bios."
        status: ""
        comment: ""
      - id: win-manage.6
        do: "L2 + R2 -> Extensions."
        expect: "The list of installed extensions (the AutoBleem Store). Cross runs one, Triangle turns it off / on."
        status: ""
        comment: ""
  - id: win-store
    title: "The Store: browse, download (speed and time), network drop and resume"
    minutes: 10
    needs: "AutoBleem on Windows with an internet connection, a few hundred MB free in the data folder."
    steps:
      - id: win-store.1
        do: "Quick menu (Up) -> Store."
        expect: "The Store opens with four tabs: Apps, Games, Downloads, Sources (L1 / R1 move between them). Sources lists AutoBleem's own catalog."
        status: ""
        comment: ""
      - id: win-store.2
        do: "Apps tab, then Games tab: browse."
        expect: "Each item shows a picture, version, size and a source favicon. Installed items carry an 'Installed' badge. L2 / R2 jump by letter, Square refreshes, Start searches the titles, Select shows one source at a time. The footer shows the keys of the selected row."
        status: ""
        comment: ""
      - id: win-store.3
        do: "Pick an item of at least a few tens of MB that is not installed yet and press Cross, then open the Downloads tab."
        expect: "The item is queued and downloads; the progress bar moves steadily."
        status: ""
        comment: ""
      - id: win-store.4
        do: "Leave the Store with Circle (back to the shelf) while it downloads."
        expect: "A bubble at the top right shows the running download with its speed and time left, in the form `1.4 MB/s · 0:42`. It goes on downloading in the background."
        status: ""
        comment: ""
      - id: win-store.5
        do: "Switch Wi-Fi off in Windows (or unplug the network cable) for about 30 seconds."
        expect: "The item says 'Waiting for the network'. The launcher does not crash or hang."
        status: ""
        comment: ""
      - id: win-store.6
        do: "Switch the network back on. Look at the progress."
        expect: "The download carries on from where it stopped (the progress does not go back to 0) and finishes. Write the percentage before and after in the comment."
        status: ""
        comment: ""
      - id: win-store.7
        do: "When it is done: open the item in the Store, then the Apps set (Select) or Re-scan games for a game."
        expect: "The item shows 'Installed'; an App is in the Apps set and starts after its read-me (Circle goes back); a game appears on the shelf after the scan with the Store's picture as its cover."
        status: ""
        comment: ""
      - id: win-store.8
        do: "Start another download and press Cross on it while it runs; then Triangle on an item the Store installed."
        expect: "Cross cancels the queued or running download. Triangle removes the item the Store installed (after its question)."
        status: ""
        comment: ""
  - id: win-pads
    title: "Pads and the keyboard"
    minutes: 5
    needs: "AutoBleem on Windows and an Xbox-style (XInput) pad."
    steps:
      - id: win-pads.1
        do: "Plug the pad in while the launcher shows the shelf."
        expect: "A short message says which pad is Player 1 and Player 2. Left / Right, Cross, Circle work with it."
        status: ""
        comment: ""
      - id: win-pads.2
        do: "L2 + R2 -> Hardware Information, look at the pads."
        expect: "The pad is listed and mapped as Player 1 (a second pad as Player 2; a third is shown as not used by the PS1 emulator)."
        status: ""
        comment: ""
      - id: win-pads.3
        do: "Press Triangle on the shelf with and then without the keyboard used last."
        expect: "The button guide has a Keyboard column once a keyboard has been used."
        status: ""
        comment: ""
      - id: win-pads.4
        do: "Is Network & Controllers in the Quick menu or the system menu? Write what you see."
        expect: "Write down what you see: it is meant for the console, the Pi and the PC stick, so on Windows it is probably missing or greyed. Nothing should crash."
        status: ""
        comment: ""
  - id: win-retroarch
    title: "RetroArch and Apps"
    minutes: 10
    needs: "AutoBleem with RetroArch installed (the tick in the installer / the answer yes on first boot), a legally owned ROM, and an App from the Store."
    steps:
      - id: win-retroarch.1
        do: "Press Select and look at the tabs (L1 / R1)."
        expect: "A RetroArch tab (one group per system with games, plus RetroArch's Favorites and History) and an Apps tab (All apps, then Games, Emulators, Tools, Media, Other). Without RetroArch installed there is no RetroArch tab - write that in the comment."
        status: ""
        comment: ""
      - id: win-retroarch.2
        do: "Put one legally owned ROM into RetroArch/roms/<system folder>/ (for example 'Sega - Mega Drive - Genesis'), then Re-scan games and start it with Cross."
        expect: "The game shows on the RetroArch tab, starts in its core with picture and sound, and 'Close Content' / 'Quit RetroArch' in RetroArch's menu comes back to the launcher."
        status: ""
        comment: ""
      - id: win-retroarch.3
        do: "On a PS1 game press Square."
        expect: "The game starts in RetroArch's PS1 core instead of the PS1 emulator; leaving returns to the launcher."
        status: ""
        comment: ""
      - id: win-retroarch.4
        do: "L2 + R2 -> RetroArch (in the Leave group)."
        expect: "RetroArch's own menu opens with nothing loaded; Quit RetroArch returns to the launcher."
        status: ""
        comment: ""
      - id: win-retroarch.5
        do: "Apps set: pick an App (one from the Store, for example) and press Cross."
        expect: "Its read-me shows first (Circle goes back); Cross starts it full screen with no window or black screen."
        status: ""
        comment: ""
      - id: win-retroarch.6
        do: "In the App: Leave through the App's own menu, as its read-me says."
        expect: "The App closes and the launcher comes back."
        status: ""
        comment: ""
      - id: win-retroarch.7
        do: "On an install made WITHOUT RetroArch (if you have one): look at the Select picker and the L2 + R2 menu."
        expect: "No RetroArch tab, no RetroArch row, no RetroArch options. Mark N/A if RetroArch is installed."
        status: ""
        comment: ""
