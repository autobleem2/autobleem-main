 font-family="RH, sans-serif" font-size="10" font-weight="700" fill="#93a3b3" text-anchor="middle">10</text><text x="774" y="356" font-family="RH, sans-serif" font-size="13" font-weight="400" fill="#93a3b3" text-anchor="start">GPIO15 RXD</text><circle cx="690" cy="410" r="9" fill="#4a5561" stroke="#33404c" stroke-width="2"/><text x="690" y="414" font-family="RH, sans-serif" font-size="10" font-weight="700" fill="#93a3b3" text-anchor="middle">11</text><text x="666" y="398" font-family="RH, sans-serif" font-size="13" font-weight="400" fill="#93a3b3" text-anchor="end">GPIO17</text><circle cx="750" cy="410" r="9" fill="#4a5561" stroke="#33404c" stroke-width="2"/><text x="750" y="414" font-family="RH, sans-serif" font-size="10" font-weight="700" fill="#93a3b3" text-anchor="middle">12</text><text x="774" y="398" font-family="RH, sans-serif" font-size="13" font-weight="400" fill="#93a3b3" text-anchor="start">GPIO18</text><circle cx="690" cy="452" r="9" fill="#4a5561" stroke="#33404c" stroke-width="2"/><text x="690" y="456" font-family="RH, sans-serif" font-size="10" font-weight="700" fill="#93a3b3" text-anchor="middle">13</text><text x="666" y="440" font-family="RH, sans-serif" font-size="13" font-weight="400" fill="#93a3b3" text-anchor="end">GPIO27</text><circle cx="750" cy="452" r="9" fill="#4a5561" stroke="#33404c" stroke-width="2"/><text x="750" y="456" font-family="RH, sans-serif" font-size="10" font-weight="700" fill="#93a3b3" text-anchor="middle">14</text><text x="774" y="440" font-family="RH, sans-serif" font-size="13" font-weight="400" fill="#93a3b3" text-anchor="start">GND</text><circle cx="690" cy="494" r="9" fill="#4a5561" stroke="#33404c" stroke-width="2"/><text x="690" y="498" font-family="RH, sans-serif" font-size="10" font-weight="700" fill="#93a3b3" text-anchor="middle">15</text><text x="666" y="482" font-family="RH, sans-serif" font-size="13" font-weight="400" fill="#93a3b3" text-anchor="end">GPIO22</text><circle cx="750" cy="494" r="9" fill="#4a5561" stroke="#33404c" stroke-width="2"/><text x="750" y="498" font-family="RH, sans-serif" font-size="10" font-weight="700" fill="#93a3b3" text-anchor="middle">16</text><text x="774" y="482" font-family="RH, sans-serif" font-size="13" font-weight="400" fill="#93a3b3" text-anchor="start">GPIO23</text><circle cx="690" cy="536" r="9" fill="#4a5561" stroke="#33404c" stroke-width="2"/><text x="690" y="540" font-family="RH, sans-serif" font-size="10" font-weight="700" fill="#93a3b3" text-anchor="middle">17</text><text x="666" y="524" font-family="RH, sans-serif" font-size="13" font-weight="400" fill="#93a3b3" text-anchor="end">3V3</text><circle cx="750" cy="536" r="9" fill="#4a5561" stroke="#33404c" stroke-width="2"/><text x="750" y="540" font-family="RH, sans-serif" font-size="10" font-weight="700" fill="#93a3b3" text-anchor="middle">18</text><text x="774" y="524" font-family="RH, sans-serif" font-size="13" font-weight="400" fill="#93a3b3" text-anchor="start">GPIO24</text><circle cx="690" cy="578" r="9" fill="#4a5561" stroke="#33404c" stroke-width="2"/><text x="690" y="582" font-family="RH, sans-serif" font-size="10" font-weight="700" fill="#93a3b3" text-anchor="middle">19</text><text x="666" y="566" font-family="RH, sans-serif" font-size="13" font-weight="400" fill="#93a3b3" text-anchor="end">GPIO10</text><circle cx="750" cy="578" r="9" fill="#4a5561" stroke="#33404c" stroke-width="2"/><text x="750" y="582" font-family="RH, sans-serif" font-size="10" font-weight="700" fill="#93a3b3" text-anchor="middle">20</text><text x="774" y="566" font-family="RH, sans-serif" font-size="13" font-weight="400" fill="#93a3b3" text-anchor="start">GND</text><polyline points="690,284 420,284 420,420 390,420" fill="none" stroke="#f2c94c" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="310" cy="420" r="5" fill="#eef3f6"/><circle cx="390" cy="420" r="5" fill="#eef3f6"/><line x1="306" y1="402" x2="394" y2="402" stroke="#f2c94c" stroke-width="4" stroke-linecap="round"/><line x1="350" y1="402" x2="350" y2="386" stroke="#f2c94c" stroke-width="4" stroke-linecap="round"/><line x1="338" y1="386" x2="362" y2="386" stroke="#f2c94c" stroke-width="3"/><text x="350" y="450" font-family="RH, sans-serif" font-size="16" font-weight="600" fill="#eef3f6" text-anchor="middle">POWER</text><polyline points="310,420 280,420 280,470 560,470 560,368 690,368" fill="none" stroke="#8a96a3" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="150" y="300" font-family="RH, sans-serif" font-size="22" font-weight="600" fill="#f2c94c" text-anchor="start">POWER</text><text x="150" y="326" font-family="RH, sans-serif" font-size="15" font-weight="500" fill="#eef3f6" text-anchor="start">GPIO3 (pin 5) + GND (pin 9)</text><text x="150" y="350" font-family="RH, sans-serif" font-size="15" font-weight="500" fill="#93a3b3" text-anchor="start">press = safe shutdown</text><text x="150" y="372" font-family="RH, sans-serif" font-size="15" font-weight="500" fill="#93a3b3" text-anchor="start">press again = start from halt</text><polyline points="750,326 930,326" fill="none" stroke="#36d9e0" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><polyline points="930,326 940,316 950,336 960,316 970,336 980,316 990,336 1000,326 1010,326" fill="none" stroke="#eef3f6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="970" y="306" font-family="RH, sans-serif" font-size="15" font-weight="600" fill="#eef3f6" text-anchor="middle">330 &#937;</text><polyline points="1010,326 1040,326" fill="none" stroke="#36d9e0" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M1048 308 L1048 344 L1078 326 Z" fill="#36d9e0" stroke="#36d9e0" stroke-width="2"/><line x1="1080" y1="306" x2="1080" y2="346" stroke="#36d9e0" stroke-width="4"/><line x1="1040" y1="326" x2="1048" y2="326" stroke="#eef3f6" stroke-width="3"/><path d="M1066 304 l12 -12 M1076 300 l12 -12" stroke="#36d9e0" stroke-width="2.5" fill="none"/><path d="M1078 292 