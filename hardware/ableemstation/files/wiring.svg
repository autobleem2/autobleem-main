H, sans-serif" font-size="20" font-weight="600" fill="#eef3f6" text-anchor="start">What to buy</text><text x="176" y="902" font-family="RH, sans-serif" font-size="15" font-weight="600" fill="#36d9e0" text-anchor="start">2 x</text><text x="220" y="902" font-family="RH, sans-serif" font-size="15" font-weight="500" fill="#eef3f6" text-anchor="start">tactile push button 6 x 6 mm, 5 mm tall, 4 pins through-hole (THT)</text><text x="1330" y="902" font-family="RH, sans-serif" font-size="13" font-weight="500" fill="#93a3b3" text-anchor="end">POWER, RESET - the bracket pockets are 6.3 x 6.3 mm</text><text x="176" y="930" font-family="RH, sans-serif" font-size="15" font-weight="600" fill="#36d9e0" text-anchor="start">1 x</text><text x="220" y="930" font-family="RH, sans-serif" font-size="15" font-weight="500" fill="#eef3f6" text-anchor="start">LED 5 mm, diffused (any colour; green / red / yellow / orange are brightest on 3.3 V)</text><text x="1330" y="930" font-family="RH, sans-serif" font-size="13" font-weight="500" fill="#93a3b3" text-anchor="end">the front holder takes 5 mm</text><text x="176" y="958" font-family="RH, sans-serif" font-size="15" font-weight="600" fill="#36d9e0" text-anchor="start">1 x</text><text x="220" y="958" font-family="RH, sans-serif" font-size="15" font-weight="500" fill="#eef3f6" text-anchor="start">resistor 330 &#937; 1/4 W (or 100 &#937; for a blue / white / cyan LED)</text><text x="1330" y="958" font-family="RH, sans-serif" font-size="13" font-weight="500" fill="#93a3b3" text-anchor="end">in series with the LED</text><text x="176" y="986" font-family="RH, sans-serif" font-size="15" font-weight="600" fill="#36d9e0" text-anchor="start">1 x</text><text x="220" y="986" font-family="RH, sans-serif" font-size="15" font-weight="500" fill="#eef3f6" text-anchor="start">2-pin male header 2.54 mm</text><text x="1330" y="986" font-family="RH, sans-serif" font-size="13" font-weight="500" fill="#93a3b3" text-anchor="end">soldered into the RUN pads</text><text x="176" y="1014" font-family="RH, sans-serif" font-size="15" font-weight="600" fill="#36d9e0" text-anchor="start">6 x</text><text x="220" y="1014" font-family="RH, sans-serif" font-size="15" font-weight="500" fill="#eef3f6" text-anchor="start">jumper wire female-female (Dupont), 20 cm + heat-shrink tube</text><text x="1330" y="1014" font-family="RH, sans-serif" font-size="13" font-weight="500" fill="#93a3b3" text-anchor="end">onto the GPIO pins and the switches' legs</text></svg>