<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1100" width="1500" height="1100"><rect width="1500" height="1100" fill="#161b21"/><text x="60" y="70" font-family="OSB, sans-serif" font-size="34" font-weight="600" fill="#eef3f6" text-anchor="start">ABleem<tspan fill="#36d9e0">Station</tspan> &#183; wiring &#183; RGB pixel</text><text x="60" y="104" font-family="RH, sans-serif" font-size="16" font-weight="500" fill="#93a3b3" text-anchor="start">Raspberry Pi 3B / 3B+ &#183; pin 1 = the square pad, at the microSD end of the header; odd pins are the row nearer the middle of the board</text><rect x="664" y="170" width="112" height="438" rx="6" fill="#1f262e" stroke="#33404c"/><text x="720.0" y="158" font-family="RH, sans-serif" font-size="14" font-weight="500" fill="#93a3b3" text-anchor="middle">GPIO header (pins 1-20)</text><rect x="681" y="191" width="18" height="18" fill="#4a5561" stroke="#eef3f6" stroke-width="2"/><text x="690" y="204" font-family="RH, sans-serif" font-size="10" font-weight="700" fill="#93a3b3" text-anchor="middle">1</text><text x="666" y="188" font-family="RH, sans-serif" font-size="13" font-weight="400" fill="#93a3b3" text-anchor="end">3V3</text><circle cx="750" cy="200" r="9" fill="#ff6b5e" stroke="#eef3f6" stroke-width="2"/><text x="750" y="204" font-family="RH, sans-serif" font-size="10" font-weight="700" fill="#161b21" text-anchor="middle">2</text><text x="774" y="188" font-family="RH, sans-serif" font-size="13" font-weight="600" fill="#eef3f6" text-anchor="start">5V</text><circle cx="690" cy="242" r="9" fill="#4a5561" stroke="#33404c" stroke-width="2"/><text x="690" y="246" font-family="RH, sans-serif" font-size="10" font-weight="700" fill="#93a3b3" text-anchor="middle">3</text><text x="666" y="230" font-family="RH, sans-serif" font-size="13" font-weight="400" fill="#93a3b3" text-anchor="end">GPIO2 SDA</text><circle cx="750" cy="242" r="9" fill="#4a5561" stroke="#33404c" stroke-width="2"/><text x="750" y="246" font-family="RH, sans-serif" font-size="10" font-weight="700" fill="#93a3b3" text-anchor="middle">4</text><text x="774" y="230" font-family="RH, sans-serif" font-size="13" font-weight="400" fill="#93a3b3" text-anchor="start">5V</text><circle cx="690" cy="284" r="9" fill="#f2c94c" stroke="#eef3f6" stroke-width="2"/><text x="690" y="288" font-family="RH, sans-serif" font-size="10" font-weight="700" fill="#161b21" text-anchor="middle">5</text><text x="666" y="272" font-family="RH, sans-serif" font-size="13" font-weight="600" fill="#eef3f6" text-anchor="end">GPIO3 SCL</text><circle cx="750" cy="284" r="9" fill="#8a96a3" stroke="#eef3f6" stroke-width="2"/><text x="750" y="288" font-family="RH, sans-serif" font-size="10" font-weight="700" fill="#161b21" text-anchor="middle">6</text><text x="774" y="272" font-family="RH, sans-serif" font-size="13" font-weight="600" fill="#eef3f6" text-anchor="start">GND</text><circle cx="690" cy="326" r="9" fill="#4a5561" stroke="#33404c" stroke-width="2"/><text x="690" y="330" font-family="RH, sans-serif" font-size="10" font-weight="700" fill="#93a3b3" text-anchor="middle">7</text><text x="666" y="314" font-family="RH, sans-serif" font-size="13" font-weight="400" fill="#93a3b3" text-anchor="end">GPIO4</text><circle cx="750" cy="326" r="9" fill="#4a5561" stroke="#33404c" stroke-width="2"/><text x="750" y="330" font-family="RH, sans-serif" font-size="10" font-weight="700" fill="#93a3b3" text-anchor="middle">8</text><text x="774" y="314" font-family="RH, sans-serif" font-size="13" font-weight="400" fill="#93a3b3" text-anchor="start">GPIO14 TXD</text><circle cx="690" cy="368" r="9" fill="#8a96a3" stroke="#eef3f6" stroke-width="2"/><text x="690" y="372" font-family="RH, sans-serif" font-size="10" font-weight="700" fill="#161b21" text-anchor="middle">9</text><text x="666" y="356" font-family="RH, sans-serif" font-size="13" font-weight="600" fill="#eef3f6" text-anchor="end">GND</text><circle cx="750" cy="368" r="9" fill="#4a5561" stroke="#33404c" stroke-width="2"/><text x="750" y="372" font-family="RH, sans-serif" font-size="10" font-weight="700" fill="#93a3b3" text-anchor="middle">10</text><text x="774" y="356" font-family="RH, sans-serif" font-size="13" font-weight="400" fill="#93a3b3" text-anchor="start">GPIO15 RXD</text><circle cx="690" cy="410" r="9" fill="#4a5561" stroke="#33404c" stroke-width="2"/><text x="690" y="414" font-family="RH, sans-serif" font-size="10" font-weight="700" fill="#93a3b3" text-anchor="middle">11</text><text x="666" y="398" font-family="RH, sans-serif" font-size="13" font-weight="400" fill="#93a3b3" text-anchor="end">GPIO17</text><circle cx="750" cy="410" r="9" fill="#4a5561" stroke="#33404c" stroke-width="2"/><text x="750" y="414" font-family="RH, sans-serif" font-size="10" font-weight="700" fill="#93a3b3" text-anchor="middle">12</text><text x="774" y="398" font-family="RH, sans-serif" font-size="13" font-weight="400" fill="#93a3b3" text-anchor="start">GPIO18</text><circle cx="690" cy="452" r="9" fill="#4a5561" stroke="#33404c" stroke-width="2"/><text x="690" y="456" font-family="RH, sans-serif" font-size="10" font-weight="700" fill="#93a3b3" text-anchor="middle">13</text><text x="666" y="440" font-family="RH, sans-serif" font-size="13" font-weight="400" fill="#93a3b3" text-anchor="end">GPIO27</text><circle cx="750" cy="452" r="9" fill="#4a5561" stroke="#33404c" stroke-width="2"/><text x="750" y="456" font-family="RH, sans-serif" font-size="10" font-weight="700" fill="#93a3b3" text-anchor="middle">14</text><text x="774" y="440" font-family="RH, sans-serif" font-size="13" font-weight="400" fill="#93a3b3" text-anchor="start">GND</text><circle cx="690" cy="494" r="9" fill="#4a5561" stroke="#33404c" stroke-width="2"/><text x="690" y="498" font-family="RH, sans-serif" font-size="10" font-weight="700" fill="#93a3b3" text-anchor="middle">15</text><text x="666" y="482" font-family="RH, sans-serif" font-size="13" font-weight="400" fill="#93a3b3" text-anchor="end">GPIO22</text><circle cx="750" cy="494" r="9" fill="#ff46aa" stroke="#eef3f6" stroke-width="2"/><text x="750" y="498" font-family="RH, sans-serif" font-size="10" font-weight="700" fill="#161b21" text-anchor="middle">16</text><text x="774" y="482" font-family="RH, sans-serif" font-size="13" font-weight="600" fill="#eef3f6" text-anchor="start">GPIO23</text><circle cx="690" cy="536" r="9" fill="#4a5561" stroke="#33404c" stroke-width="2"/><text x="690" y="540" font-family="RH, sans-serif" font-size="10" font-weight="700" fill="#93a3b3" text-anchor="middle">17</text><text x="666" y="524" font-family="RH, sans-serif" font-size="13" font-weight="400" fill="#93a3b3" text-anchor="end">3V3</text><circle cx="750" cy="536" r="9" fill="#4a5561" stroke="#33404c" stroke-width="2"/><text x="750" y="540" font-family="RH, sans-serif" font-size="10" font-weight="700" fill="#93a3b3" text-anchor="middle">18</text><text x="774" y="524" font-family="RH, sans-serif" font-size="13" font-weight="400" fill="#93a3b3" text-anchor="start">GPIO24</text><circle cx="690" cy="578" r="9" fill="#3cff6e" stroke="#eef3f6" stroke-width="2"/><text x="690" y="582" font-family="RH, sans-serif" font-size="10" font-weight="700" fill="#161b21" text-anchor="middle">19</text><text x="666" y="566" font-family="RH, sans-serif" font-size="13" font-weight="600" fill="#eef3f6" text-anchor="end">GPIO10 MOSI</text><circle cx="750" cy="578" r="9" fill="#8a96a3" stroke="#eef3f6" stroke-width="2"/><text x="750" y="582" font-family="RH, sans-serif" font-size="10" font-weight="700" fill="#161b21" text-anchor="middle">20</text><text x="774" y="566" font-family="RH, sans-serif" font-size="13" font-weight="600" fill="#eef3f6" text-anchor="start">GND</text><polyline points="690,284 420,284 420,420 390,420" fill="none" stroke="#f2c94c" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="310" cy="420" r="5" fill="#eef3f6"/><circle cx="390" cy="420" r="5" fill="#eef3f6"/><line x1="306" y1="402" x2="394" y2="402" stroke="#f2c94c" stroke-width="4" stroke-linecap="round"/><line x1="350" y1="402" x2="350" y2="386" stroke="#f2c94c" stroke-width="4" stroke-linecap="round"/><line x1="338" y1="386" x2="362" y2="386" stroke="#f2c94c" stroke-width="3"/><text x="350" y="450" font-family="RH, sans-serif" font-size="16" font-weight="600" fill="#eef3f6" text-anchor="middle">POWER</text><polyline points="310,420 280,420 280,470 560,470 560,368 690,368" fill="none" stroke="#8a96a3" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="120" y="300" font-family="RH, sans-serif" font-size="22" font-weight="600" fill="#f2c94c" text-anchor="start">POWER</text><text x="120" y="326" font-family="RH, sans-serif" font-size="15" font-weight="500" fill="#eef3f6" text-anchor="start">GPIO3 (pin 5) + GND (pin 9)</text><text x="120" y="350" font-family="RH, sans-serif" font-size="15" font-weight="500" fill="#93a3b3" text-anchor="start">press = safe shutdown</text><text x="120" y="372" font-family="RH, sans-serif" font-size="15" font-weight="500" fill="#93a3b3" text-anchor="start">press again = start from halt</text><polyline points="750,494 880,494" fill="none" stroke="#ff46aa" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="880" cy="494" r="5" fill="#eef3f6"/><circle cx="960" cy="494" r="5" fill="#eef3f6"/><line x1="876" y1="476" x2="964" y2="476" stroke="#ff46aa" stroke-width="4" stroke-linecap="round"/><line x1="920" y1="476" x2="920" y2="460" stroke="#ff46aa" stroke-width="4" stroke-linecap="round"/><line x1="908" y1="460" x2="932" y2="460" stroke="#ff46aa" stroke-width="3"/><text x="920" y="524" font-family="RH, sans-serif" font-size="16" font-weight="600" fill="#eef3f6" text-anchor="middle">RESET</text><polyline points="960,494 1000,494 1000,578 750,578" fill="none" stroke="#8a96a3" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="1040" y="480" font-family="RH, sans-serif" font-size="22" font-weight="600" fill="#ff46aa" text-anchor="start">RESET</text><text x="1040" y="506" font-family="RH, sans-serif" font-size="15" font-weight="500" fill="#eef3f6" text-anchor="start">GPIO23 (pin 16) + GND (pin 20)</text><text x="1040" y="530" font-family="RH, sans-serif" font-size="15" font-weight="500" fill="#93a3b3" text-anchor="start">the console's Reset: in a game = back to</text><text x="1040" y="552" font-family="RH, sans-serif" font-size="15" font-weight="500" fill="#93a3b3" text-anchor="start">the menu, in an App = close it</text><polyline points="750,200 1010,200 1010,225 1060,225" fill="none" stroke="#ff6b5e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><polyline points="750,284 980,284 980,255 1060,255" fill="none" stroke="#8a96a3" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><polyline points="690,578 610,578 610,640 1440,640 1440,450" fill="none" stroke="#3cff6e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><polyline points="1440,370 1430,380 1450,390 1430,400 1450,410 1430,420 1450,430 1440,440 1440,450" fill="none" stroke="#eef3f6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="1420" y="416" font-family="RH, sans-serif" font-size="15" font-weight="600" fill="#eef3f6" text-anchor="end">330 &#937;</text><polyline points="1440,370 1440,255 1180,255" fill="none" stroke="#3cff6e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><rect x="1060" y="170" width="120" height="110" rx="6" fill="#1f262e" stroke="#eef3f6" stroke-width="2"/><rect x="1100" y="180" width="40" height="34" rx="4" fill="#f4f4f0"/><circle cx="1120" cy="197" r="9" fill="none" stroke="#c9c9c4" stroke-width="3"/><circle cx="1060" cy="225" r="5" fill="#eef3f6"/><circle cx="1060" cy="255" r="5" fill="#eef3f6"/><circle cx="1180" cy="255" r="5" fill="#eef3f6"/><text x="1070" y="230" font-family="RH, sans-serif" font-size="12" font-weight="600" fill="#eef3f6" text-anchor="start">5V</text><text x="1070" y="260" font-family="RH, sans-serif" font-size="12" font-weight="600" fill="#eef3f6" text-anchor="start">GND</text><text x="1170" y="260" font-family="RH, sans-serif" font-size="12" font-weight="600" fill="#eef3f6" text-anchor="end">DIN</text><text x="1120" y="302" font-family="RH, sans-serif" font-size="14" font-weight="500" fill="#93a3b3" text-anchor="middle">WS2812B pixel (cut from a 5 V strip; DIN = the arrow's start)</text><text x="1060" y="350" font-family="RH, sans-serif" font-size="22" font-weight="600" fill="#3cff6e" text-anchor="start">RGB pixel</text><text x="1060" y="376" font-family="RH, sans-serif" font-size="15" font-weight="500" fill="#eef3f6" text-anchor="start">5V (pin 2) + GND (pin 6)</text><text x="1060" y="398" font-family="RH, sans-serif" font-size="15" font-weight="500" fill="#eef3f6" text-anchor="start">DIN &#8592; 330 &#937; &#8592; GPIO10 (pin 19)</text><text x="1060" y="422" font-family="RH, sans-serif" font-size="15" font-weight="500" fill="#93a3b3" text-anchor="start">green = on, orange = standby</text><rect x="120" y="680" width="1260" height="176" rx="8" fill="#1f262e" stroke="#33404c"/><text x="146" y="716" font-family="RH, sans-serif" font-size="17" font-weight="600" fill="#eef3f6" text-anchor="start">/boot/config.txt (add these lines, then reboot once)</text><text x="146" y="752" font-family="monospace, sans-serif" font-size="17" font-weight="500" fill="#36d9e0" text-anchor="start">dtoverlay=gpio-shutdown</text><text x="1354" y="752" font-family="RH, sans-serif" font-size="14" font-weight="500" fill="#93a3b3" text-anchor="end">POWER</text><text x="146" y="780" font-family="monospace, sans-serif" font-size="17" font-weight="500" fill="#36d9e0" text-anchor="start">dtoverlay=gpio-key,gpio=23,active_low=1,gpio_pull=up,keycode=164</text><text x="1354" y="780" font-family="RH, sans-serif" font-size="14" font-weight="500" fill="#93a3b3" text-anchor="end">RESET (164 = the console's Reset key)</text><text x="146" y="808" font-family="monospace, sans-serif" font-size="17" font-weight="500" fill="#36d9e0" text-anchor="start">dtparam=spi=on</text><text x="1354" y="808" font-family="RH, sans-serif" font-size="14" font-weight="500" fill="#93a3b3" text-anchor="end">the pixel's data line (SPI)</text><text x="146" y="840" font-family="RH, sans-serif" font-size="14" font-weight="500" fill="#93a3b3" text-anchor="start">+ a small service on the Pi sets the colour: green at boot, orange at shutdown (the pixel keeps it through the standby)</text><rect x="120" y="876" width="1260" height="190" rx="8" fill="#1f262e" stroke="#33404c"/><text x="146" y="912" font-family="RH, sans-serif" font-size="20" font-weight="600" fill="#eef3f6" text-anchor="start">What to buy</text><text x="146" y="948" font-family="RH, sans-serif" font-size="15" font-weight="600" fill="#36d9e0" text-anchor="start">2 x</text><text x="190" y="948" font-family="RH, sans-serif" font-size="15" font-weight="500" fill="#eef3f6" text-anchor="start">tactile push button 6 x 6 mm, 5 mm tall, 4 pins through-hole (THT)</text><text x="1354" y="948" font-family="RH, sans-serif" font-size="13" font-weight="500" fill="#93a3b3" text-anchor="end">POWER, RESET - the bracket pockets are 6.3 x 6.3 mm</text><text x="146" y="978" font-family="RH, sans-serif" font-size="15" font-weight="600" fill="#36d9e0" text-anchor="start">1 x</text><text x="190" y="978" font-family="RH, sans-serif" font-size="15" font-weight="500" fill="#eef3f6" text-anchor="start">WS2812B LED strip, 5 V, 60 LEDs/m, 10 mm wide (one pixel is cut off it)</text><text x="1354" y="978" font-family="RH, sans-serif" font-size="13" font-weight="500" fill="#93a3b3" text-anchor="end">slides into the slot behind the lens</text><text x="146" y="1008" font-family="RH, sans-serif" font-size="15" font-weight="600" fill="#36d9e0" text-anchor="start">1 x</text><text x="190" y="1008" font-family="RH, sans-serif" font-size="15" font-weight="500" fill="#eef3f6" text-anchor="start">resistor 330 &#937; 1/4 W</text><text x="1354" y="1008" font-family="RH, sans-serif" font-size="13" font-weight="500" fill="#93a3b3" text-anchor="end">in the data line, close to the pixel</text><text x="146" y="1038" font-family="RH, sans-serif" font-size="15" font-weight="600" fill="#36d9e0" text-anchor="start">7 x</text><text x="190" y="1038" font-family="RH, sans-serif" font-size="15" font-weight="500" fill="#eef3f6" text-anchor="start">jumper wire female-female (Dupont), 20 cm + heat-shrink tube</text><text x="1354" y="1038" font-family="RH, sans-serif" font-size="13" font-weight="500" fill="#93a3b3" text-anchor="end">three soldered to the pixel's pads</text></svg>